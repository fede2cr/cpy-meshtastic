# Builds the meshtastic modules for the ESP32-S3, a CircuitPython image for
# each board, TinyUF2 for the W12, and runs the tests.
#
# No trigger of its own: ci.yml calls it on a push and release.yml calls it on
# a tag, so what ships is built the way CI already proved the branch builds.
#
# One module architecture. A natmod carries machine code, so the Rust half is
# per instruction set, and `xtensawin` is the one the ESP32-S3 runs. The Thumb
# build the nRF52840 needs is not published here yet. `make` (not `make w12`)
# is the target that produces it when that changes.
#
# The images are the fork's tree plus one board. Neither board is in
# fede2cr/circuitpython@cpy-rust, so each is carried here as a patch in
# temp-board-patches/ and applied before the build -- and skipped, with a
# notice, once the fork has the board itself, which is the signal to delete
# the patch. The W12 ships with no UF2 bootloader at all, so TinyUF2 is built
# for it the same way, from its own patch against adafruit/tinyuf2.
#
# THIS WILL NOT BUILD AGAINST STOCK CIRCUITPYTHON. The Rust half is a native
# module, and stock `tools/mpy_ld.py` rejects the relocations rustc emits for
# Xtensa: LLVM writes R_XTENSA_NONE no-op entries that GAS does not, encodes
# `l32r` differently, and puts the jump table of a dense `match` in .rodata.
# The fix is in the host linker script, so it cannot be carried here. The
# `cpy-rust` branch has it, and is enough: nothing in this artifact needs the
# board, the pin interrupts or the _bleio queue that live on other branches.

name: build

on:
  workflow_call:
    inputs:
      circuitpython_repo:
        description: Fork carrying the Rust natmod linker patches
        type: string
        default: fede2cr/circuitpython
      circuitpython_ref:
        description: Ref within that fork
        type: string
        default: cpy-rust
      tinyuf2_repo:
        description: TinyUF2 repository the W12 bootloader is built from
        type: string
        default: adafruit/tinyuf2
      tinyuf2_ref:
        description: Ref within that repository
        type: string
        # Pinned rather than master: the bootloader is flashed once and then
        # lives on the board, so it should only change when someone means it
        # to. This is the commit the W12 board was brought up on.
        default: 6ca7559832df25513351f8fa2f43a8605c723dd5
      version:
        description: Version stamped into the artifact names
        type: string
        default: 0.0.0+dev

permissions:
  contents: read

jobs:
  # Cheapest job and the one that fails most often, so it runs on its own
  # rather than behind a toolchain install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install nightly --component rust-src

      - name: Rust unit tests
        # --lib is required, not tidiness: the crate builds with
        # panic-immediate-abort, and the doc and integration harnesses want
        # unwinding, which is not available without std.
        run: cargo +nightly test --lib -p meshtastic

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the host test dependencies
        # hoststub stands in for `aesio` with the real AES from cryptography,
        # so the host arrives at the same ciphertext the board does. It is the
        # only third-party import in the test path, and setup-python gives a
        # clean interpreter that does not carry it.
        run: pip install cryptography

      - name: Python layers against the host stubs
        # hoststub reads meshtastic/python/*.py relative to the repo root, so
        # this has to run from there.
        run: |
          python -m compileall -q meshtastic/python
          python tools/hosttest.py

      - name: Part drivers against a recording native module
        # hosttest fakes meshradio's contract, so a chip register written at the
        # wrong moment is invisible to it. This is the layer underneath, and it
        # is what keeps the receive-length regression from coming back. It skips
        # any driver whose directory is not in this tree and says so.
        run: python tools/radiotest.py

  # What goes on the CIRCUITPY drive: the Rust half as the package's __init__,
  # the Python layers merged beside it. The radio driver is deliberately not
  # here -- it ships from fede2cr/cpy-lr2021, and a second copy published from
  # this repository would be a second thing to keep in step.
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpy-meshtastic
          persist-credentials: false

      - name: Check out the patched CircuitPython
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.circuitpython_repo }}
          ref: ${{ inputs.circuitpython_ref }}
          path: circuitpython
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the CircuitPython history and tags
        # Two fetches, and both are needed. `make fetch-tags` pulls adafruit's
        # tags and deepens adafruit's own history -- it fetches from adafruit by
        # URL, so it never brings in this fork's commits. py/version.py then
        # runs `git describe --first-parent`, which walks *this branch's*
        # parents, and after a depth-1 checkout of a fork branch those are not
        # here. Describe hits the shallow boundary, falls back to a bare hash,
        # and py/makeversionhdr.py rejects it with "Cannot determine version" --
        # naming the fetch that just ran, which is why the failure misleads.
        #
        # Deepening this branch to the same 2023 cutoff the tree uses for tags
        # is enough, and avoids cloning the whole ~500 MB history.
        env:
          REF: ${{ inputs.circuitpython_ref }}
        run: |
          git -C circuitpython fetch --shallow-since="2023-02-01" origin "$REF" \
            || git -C circuitpython fetch --deepen=200 origin "$REF"
          make -C circuitpython fetch-tags
          # Checked here rather than left to mpy-cross: makeversionhdr.py splits
          # this on "." and emits the first three parts as C integer literals,
          # so a bare hash fails two steps later pointing at the wrong remedy.
          version=$(git -C circuitpython describe --dirty --tags --always \
                      --first-parent --match '[!v]*')
          echo "CircuitPython version: $version"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::git describe gave '$version', not a version: the deepen above did not reach a tag" ; exit 1 ;;
          esac

      - name: Fetch the huffman submodule
        # maketranslationdata.py compresses the message table with it, so
        # mpy-cross does not build without it.
        run: git -C circuitpython submodule update --init --depth 1 tools/huffman

      # Before the Xtensa toolchains, and that ordering is load-bearing.
      # mpy-cross is a host binary: gcc compiles py/nlrx64.c and hands the
      # result to whichever `as` it finds on PATH. The IDF install below
      # prepends its tools, three of which are <prefix>/<target>/bin
      # directories holding *unprefixed* binutils, and those cross assemblers
      # have no `--64`. A step cannot be polluted by a PATH it precedes.
      - name: Build mpy-cross
        run: make -C circuitpython/mpy-cross -j"$(nproc)"

      # Upstream rustc has no Xtensa backend, so this is the `esp` fork rather
      # than a target added to nightly.
      - name: Install the Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false

      # The Rust fork brings its own LLVM but no binutils, and the natmod link
      # needs `ld -r`, `ar` and `objcopy` for the S3 specifically: the generic
      # xtensa-esp-elf driver has no chip dynconfig and builds big-endian.
      - name: Install the Xtensa binutils
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.3
          tools: xtensa-esp-elf

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Python build dependencies
        # pyelftools reads the crate's ELF objects; `ar` is how tools/ar_util.py
        # opens the .a archive. Installed after the IDF step because that step
        # puts its own venv on PATH, so `pip` and the `python3` the build then
        # calls have to be the same interpreter.
        run: pip install pyelftools ar

      - name: Build the modules
        working-directory: cpy-meshtastic
        run: make w12 MPY_DIR=../circuitpython PYTHON=python3

      - name: Check the drive layout
        # Everything of ours is one package directory, and the artifact is
        # copied to CIRCUITPY as-is. A module that lands anywhere else imports
        # as nothing, so the shape is worth asserting rather than eyeballing.
        working-directory: cpy-meshtastic
        run: |
          missing=0
          for f in code.py repl.py settings.toml \
                   lib/meshtastic/__init__.mpy lib/meshtastic/meshlib.mpy \
                   lib/meshtastic/meshphone.mpy lib/meshtastic/meshtext.mpy \
                   lib/meshtastic/meshcache.mpy; do
            [ -f "dist-w12/$f" ] || { echo "missing dist-w12/$f"; missing=1; }
          done
          # __init__ is the Rust half. Without it the directory is a namespace
          # package: the submodules still import and `meshtastic.decode` does
          # not, which fails a long way from here.
          #
          # And the radio driver must *not* be here: it is released from its own
          # repository, and one shipped by accident from this one would be a
          # second copy to keep in step.
          for f in dist-w12/lib/lr2021.mpy dist-w12/lib/lr1121.mpy; do
            [ -f "$f" ] && { echo "$f should not be published from here"; missing=1; }
          done
          exit $missing

      - name: Name the artifact after the version
        working-directory: cpy-meshtastic
        env:
          VERSION: ${{ inputs.version }}
        run: mv dist-w12 "meshtastic-${VERSION#v}-xtensawin"

      - name: Record what was built
        working-directory: cpy-meshtastic
        env:
          VERSION: ${{ inputs.version }}
          CIRCUITPYTHON_REPO: ${{ inputs.circuitpython_repo }}
          CIRCUITPYTHON_REF: ${{ inputs.circuitpython_ref }}
        run: |
          dir="meshtastic-${VERSION#v}-xtensawin"
          {
            echo "### modules (xtensawin)"
            echo ""
            echo "| file | bytes |"
            echo "|---|---|"
            for f in "$dir"/lib/meshtastic/*; do
              echo "| \`${f#$dir/lib/}\` | $(stat -c%s "$f") |"
            done
            echo ""
            # Byte 1 is the format version the firmware refuses a mismatch on.
            echo "| | |"
            echo "|---|---|"
            echo "| mpy format version | $(od -An -tu1 -j1 -N1 "$dir/lib/meshtastic/meshlib.mpy" | tr -d ' ') |"
            echo "| CircuitPython | \`$CIRCUITPYTHON_REPO@$CIRCUITPYTHON_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: meshtastic-modules-${{ inputs.version }}-xtensawin
          path: cpy-meshtastic/meshtastic-*-xtensawin
          if-no-files-found: error

  # A CircuitPython image per board: the fork above plus the board definition
  # from temp-board-patches/. Nothing of this repository's is built into it --
  # the library stays on the drive, where the modules job puts it -- so what
  # makes these images ours is only that the boards exist and that
  # CIRCUITPY_ENABLE_MPY_NATIVE is on, which their mpconfigboard.mk sets.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: muzi_base_duo
            port: nordic
          - board: meshnology_w12
            port: espressif
    env:
      BOARD: ${{ matrix.board }}
      PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpy-meshtastic
          persist-credentials: false

      - name: Check out the patched CircuitPython
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.circuitpython_repo }}
          ref: ${{ inputs.circuitpython_ref }}
          path: circuitpython
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the CircuitPython history and tags
        # The same two fetches as the modules job, for the same reason: the
        # image's version string comes from `git describe --first-parent`,
        # and a bare hash fails the build in py/makeversionhdr.py.
        env:
          REF: ${{ inputs.circuitpython_ref }}
        run: |
          git -C circuitpython fetch --shallow-since="2023-02-01" origin "$REF" \
            || git -C circuitpython fetch --deepen=200 origin "$REF"
          make -C circuitpython fetch-tags

      - name: Add the board
        # Committed rather than applied to the work tree, so the version the
        # image reports is not stamped -dirty. Skipped once the fork carries
        # the board itself: from then on the fork's copy is the one to build,
        # and the patch here is dead weight to delete.
        env:
          REPO: ${{ inputs.circuitpython_repo }}
          REF: ${{ inputs.circuitpython_ref }}
        run: |
          patch="$GITHUB_WORKSPACE/cpy-meshtastic/temp-board-patches/circuitpython-$BOARD.patch"
          if [ -d "circuitpython/ports/$PORT/boards/$BOARD" ]; then
            echo "::notice::$REPO@$REF already has $BOARD; temp-board-patches/circuitpython-$BOARD.patch is no longer used and can be deleted"
          else
            git -C circuitpython -c user.name="cpy-meshtastic CI" \
              -c user.email="ci@invalid" am "$patch"
          fi
          version=$(git -C circuitpython describe --dirty --tags --always \
                      --first-parent --match '[!v]*')
          echo "CircuitPython version: $version"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::git describe gave '$version', not a version: the deepen above did not reach a tag" ; exit 1 ;;
          esac
          echo "CP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the submodules the board needs
        # ci_fetch_deps.py is what CircuitPython's own CI uses, and knows
        # which of the tree's ~80 submodules each port reads. For espressif it
        # clones the IDF but not the IDF's own submodules, hence the second
        # line.
        working-directory: circuitpython
        run: |
          python3 tools/ci_fetch_deps.py "$BOARD"
          if [ "$PORT" = espressif ]; then
            git submodule update --init --depth=1 --recursive ports/espressif/esp-idf
          fi

      - name: Install the Arm toolchain
        if: matrix.port == 'nordic'
        # The release CircuitPython's own CI pins, so the image is built the
        # way a stock one for any other nRF52840 board is.
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.2.Rel1"

      - name: Locate the IDF
        if: matrix.port == 'espressif'
        run: |
          echo "IDF_PATH=$GITHUB_WORKSPACE/circuitpython/ports/espressif/esp-idf" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$GITHUB_WORKSPACE/.idf_tools" >> "$GITHUB_ENV"
          echo "ESP_ROM_ELF_DIR=$GITHUB_WORKSPACE/.idf_tools" >> "$GITHUB_ENV"
          echo "IDF_COMMIT=$(git -C circuitpython rev-parse HEAD:ports/espressif/esp-idf)" >> "$GITHUB_ENV"

      - name: Cache the IDF tools
        if: matrix.port == 'espressif'
        uses: actions/cache@v5
        with:
          path: ${{ env.IDF_TOOLS_PATH }}
          key: ${{ runner.os }}-${{ env.pythonLocation }}-idf-tools-${{ env.IDF_COMMIT }}

      - name: Install the IDF tools
        # The IDF the tree pins, not the Xtensa toolchain the modules job
        # installs: CircuitPython builds against its own fork of the IDF, and
        # a different release of it would not configure.
        if: matrix.port == 'espressif'
        run: |
          "$IDF_PATH/install.sh" esp32s3
          "$IDF_PATH/tools/idf_tools.py" install ninja
          rm -rf "$IDF_TOOLS_PATH/dist"
          source "$IDF_PATH/export.sh"
          echo "IDF_PYTHON_ENV_PATH=$IDF_PYTHON_ENV_PATH" >> "$GITHUB_ENV"
          echo "$PATH" >> "$GITHUB_PATH"
          python3 -u circuitpython/tools/ci_set_idf_constraint.py

      - name: Install the Python build dependencies
        # On espressif this is the IDF's own venv, now first on PATH, and the
        # constraints file keeps pip from upgrading anything the IDF pins.
        working-directory: circuitpython
        run: |
          if [ -n "${IDF_CONSTRAINT_FILE:-}" ] && [ -f "$IDF_CONSTRAINT_FILE" ]; then
            pip install -c "$IDF_CONSTRAINT_FILE" -r requirements-dev.txt
          else
            pip install -r requirements-dev.txt
          fi

      - name: Build the image
        working-directory: circuitpython/ports/${{ matrix.port }}
        run: make -j"$(nproc)" BOARD="$BOARD"

      - name: Name the image after the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp "circuitpython/ports/$PORT/build-$BOARD/firmware.uf2" \
             "circuitpython-$BOARD-${VERSION#v}.uf2"

      - name: Record what was built
        env:
          VERSION: ${{ inputs.version }}
          CIRCUITPYTHON_REPO: ${{ inputs.circuitpython_repo }}
          CIRCUITPYTHON_REF: ${{ inputs.circuitpython_ref }}
        run: |
          f="circuitpython-$BOARD-${VERSION#v}.uf2"
          {
            echo "### firmware ($BOARD)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| file | \`$f\` |"
            echo "| bytes | $(stat -c%s "$f") |"
            echo "| CircuitPython | \`$CP_VERSION\` from \`$CIRCUITPYTHON_REPO@$CIRCUITPYTHON_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}-${{ inputs.version }}
          path: circuitpython-${{ matrix.board }}-*.uf2
          if-no-files-found: error

  # The W12 is sold with no UF2 bootloader, so the image above has nothing to
  # be dropped onto until this is flashed once over USB with esptool. Built the
  # way TinyUF2's own CI builds every Espressif board -- in the IDF release
  # container it is tested against -- from the board patch in
  # temp-board-patches/.
  tinyuf2:
    runs-on: ubuntu-latest
    env:
      BOARD: meshnology_w12
    steps:
      - uses: actions/checkout@v7
        with:
          path: cpy-meshtastic
          persist-credentials: false

      - name: Check out TinyUF2
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tinyuf2_repo }}
          ref: ${{ inputs.tinyuf2_ref }}
          path: tinyuf2
          # Whole history and tags: the bootloader reports `git describe` as
          # its version in INFO_UF2.TXT, and a bare hash says less.
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Add the board
        env:
          REPO: ${{ inputs.tinyuf2_repo }}
          REF: ${{ inputs.tinyuf2_ref }}
        run: |
          patch="$GITHUB_WORKSPACE/cpy-meshtastic/temp-board-patches/tinyuf2-$BOARD.patch"
          if [ -d "tinyuf2/ports/espressif/boards/$BOARD" ]; then
            echo "::notice::$REPO@$REF already has $BOARD; temp-board-patches/tinyuf2-$BOARD.patch is no longer used and can be deleted"
          else
            git -C tinyuf2 -c user.name="cpy-meshtastic CI" \
              -c user.email="ci@invalid" am "$patch"
          fi

      - name: Fetch the board's dependencies
        working-directory: tinyuf2
        run: python3 tools/get_deps.py --board "$BOARD"

      - name: Build
        working-directory: tinyuf2
        run: |
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v5.3.2 \
            /bin/bash -c "git config --global --add safe.directory '*' && idf.py -C ports/espressif -DBOARD=$BOARD build"

      - name: Package
        # The same two assets TinyUF2 publishes for every board it releases:
        # everything esptool needs in one zip, flat, and the self-updater on
        # its own for a board that already runs an older TinyUF2.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bin="tinyuf2/ports/espressif/_bin/$BOARD"
          zip -jr "tinyuf2-$BOARD-${VERSION#v}.zip" "$bin"
          cp "$bin/apps/update-tinyuf2.uf2" "update-tinyuf2-$BOARD-${VERSION#v}.uf2"
          {
            echo "### tinyuf2 ($BOARD)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| TinyUF2 | \`$(git -C tinyuf2 describe --dirty --always --tags)\` |"
            echo "| flash_args | \`$(head -1 "$bin/flash_args")\` |"
            echo "| combined.bin | $(stat -c%s "$bin/combined.bin") bytes, written at 0x0 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tinyuf2-meshnology_w12-${{ inputs.version }}
          path: |
            tinyuf2-meshnology_w12-*.zip
            update-tinyuf2-meshnology_w12-*.uf2
          if-no-files-found: error
