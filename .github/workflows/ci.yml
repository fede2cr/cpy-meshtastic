# Builds and tests every push and pull request. Nothing is published here;
# build.yml uploads artifacts and a release would call the same file on a tag,
# so what ships is built the way CI already proved the branch builds.
#
# Tags are excluded so a tag push does not build twice.

name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      circuitpython_repo:
        description: The patched CircuitPython fork; stock will not build
        required: false
      circuitpython_ref:
        description: Ref within that fork
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      circuitpython_repo: ${{ inputs.circuitpython_repo || 'fede2cr/circuitpython' }}
      circuitpython_ref: ${{ inputs.circuitpython_ref || 'cpy-rust' }}
